<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Gerald Glenn Galero</title>
  <meta name="description" content="Get in touch with Gerald Glenn Galero.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">...</nav> <!-- active: contact.html -->

  <main class="main-content">
    <section class="section">
      <div class="container">
        <div class="section-header fade-in">
          <h2>Let's Connect</h2>
          <p>I'm open to opportunities, collaborations, and conversations.</p>
        </div>

        <div class="grid">
          <!-- Contact Info (same as index but without redundancy) -->
          <div class="card fade-in">
            <h3>Contact Information</h3>
            <div style="display: flex; flex-direction: column; gap: var(--space-sm); margin-top: var(--space-md);">
              <div style="display: flex; align-items: center; gap: var(--space-sm);">
                <div style="width: 40px; height: 40px; background: var(--bg-tertiary); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                  <i class="fas fa-envelope" style="color: var(--accent);"></i>
                </div>
                <div>
                  <h4 style="margin-bottom: 0.25rem;">Email</h4>
                  <a href="mailto:geraldglenngalero3@gmail.com">geraldglenngalero3@gmail.com</a>
                </div>
              </div>
              <!-- phone, location, LinkedIn similar -->
            </div>
          </div>

          <!-- Contact Form -->
          <div class="card fade-in">
            <h3>Send a Message</h3>
            <form id="contactForm" class="contact-form">
              <div class="form-group">
                <input type="text" id="name" class="form-input" placeholder="Your Name" required>
              </div>
              <div class="form-group">
                <input type="email" id="email" class="form-input" placeholder="Your Email" required>
              </div>
              <div class="form-group">
                <textarea id="message" class="form-textarea" placeholder="Your Message" required></textarea>
              </div>
              <button type="submit" class="btn btn-primary" style="width: 100%;">Send Message</button>
              <div id="formMessage"></div>
            </form>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">...</footer>
  <script src="main.js"></script>
</body>
</html>
